<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    background:#0b0f14; /* fallback while video loads */
}

/* Background video */
video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Overlay */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:-1;
}

/* Profile */
.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:40px;
    box-shadow:0 0 25px rgba(255,255,255,0.4);
}

/* Icons */
.icons{
    display:flex;
    gap:80px;
    margin-bottom:40px;
}

.icon{
    width:90px;
    height:90px;
    cursor:pointer;
    transition:0.4s ease;
}

.icon path, .icon circle{
    fill:none;
    stroke:white;
    stroke-width:1.6;
    transition:0.4s ease;
}

.insta.active path,
.insta.active circle{
    stroke:#d62976;
    filter:drop-shadow(0 0 15px #d62976)
           drop-shadow(0 0 25px #962fbf);
}

.yt.active path{
    stroke:#ff0000;
    filter:drop-shadow(0 0 15px red)
           drop-shadow(0 0 30px red);
}

/* Description box */
.description{
    max-width:400px;
    text-align:center;
    font-size:14px;
    line-height:1.6;
    opacity:0.85;
}
</style>
</head>

<body>

<!-- Background Video -->
<video autoplay muted loop playsinline preload="auto">
    <source src="VID_20240816_045826.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- Background Music -->
<audio id="bgMusic" autoplay loop>
    <source src="Kokou no Hito.mp3" type="audio/mpeg">
</audio>

<img src="https://i.imgur.com/wD8CbcZ.jpeg" class="profile">

<div class="icons">

<svg class="icon insta" viewBox="0 0 24 24" onclick="openInsta(this)">
<path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2z"/>
<circle cx="12" cy="12" r="4"/>
<circle cx="17.5" cy="6.5" r="1"/>
</svg>

<svg class="icon yt" viewBox="0 0 24 24" onclick="openYT(this)">
<path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.8 15.5v-7l6 3.5-6 3.5z"/>
</svg>

</div>

<div class="description">
I'm Ray turned 18 recently and 
    i really like tech,art and philosophy 
</div>

<script>
const audio = document.getElementById("bgMusic");

// Mobile browsers block autoplay until interaction
document.addEventListener("click", () => {
    audio.play();
});

function openInsta(el){
    el.classList.add("active");
    setTimeout(()=>{
        window.location.href="https://instagram.com/r4yyyyxz";
    },400);
}

function openYT(el){
    el.classList.add("active");
    setTimeout(()=>{
        window.location.href="https://youtube.com/@rayyyyxz";
    },400);
}
</script>

</body>
</html>
